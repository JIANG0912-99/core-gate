name: build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: |
          clang -dynamiclib -arch arm64e -isysroot $(xcrun --sdk iphoneos --show-sdk-path) -miphoneos-version-min=17.0 -fobjc-arc -O2 -framework Foundation -framework UIKit -install_name @executable_path/MGUnlock.dylib MGUnlock.m -o MGUnlock.dylib
          ls -la MGUnlock.dylib
          file MGUnlock.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: unlock-dylib
          path: MGUnlock.dylib
